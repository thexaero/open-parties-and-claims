plugins {
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    // id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

java.withSourcesJar()

base {
    archivesName = "${mod_name}-forge-${minecraft_version}"
}

//mixin {
//    add(sourceSets.main, "${mod_id}.refmap.json")
//
//    config("${mod_id}.mixins.json")
//    config("${mod_id}.forge.mixins.json")
//    config("${mod_id}.create.mixins.json")
//    config("${mod_id}.create.forge.mixins.json")
//}

jar {
    manifest {
        attributes["MixinConfigs"] = "${mod_id}.mixins.json,${mod_id}.forge.mixins.json,${mod_id}.create.mixins.json,${mod_id}.create.forge.mixins.json"
    }
}

minecraft {
    
    if (project.hasProperty('forge_ats_enabled') && project.findProperty('forge_ats_enabled').toBoolean()) {
        // This location is hardcoded in Forge and can not be changed.
        // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
        accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
        project.logger.debug('Forge Access Transformers are enabled for this project.')
    }

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven {
        url "https://chocolateminecraft.com/maven"
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    compileOnly project(":Common")
    compileOnly project(":CreateSupportCommon")

    implementation("io.github.llamalad7:mixinextras-forge:0.3.5")//required for forgeconfigapiport because the transitive dep causes issues
    implementation("fuzs.forgeconfigapiport:forgeconfigapiport-forge:21.11.1"){//source: https://github.com/Fuzss/forgeconfigapiport-fabric
        transitive = false
    }

    compileOnly "curse.maven:ftbranks-314905:6431744"//home: https://www.curseforge.com/minecraft/mc-mods/ftb-ranks-forge
    compileOnly "curse.maven:architectury-419699:5786327"//home: https://www.curseforge.com/minecraft/mc-mods/architectury-api
    compileOnly "curse.maven:ftblibrary-404465:7746959"//home: https://www.curseforge.com/minecraft/mc-mods/ftb-library-forge

    compileOnly "maven.modrinth:resourceful-lib:2.1.1"//source: https://github.com/Team-Resourceful/ResourcefulLib
    compileOnly "maven.modrinth:odyssey-roles:0.0.0"//source: https://github.com/terrarium-earth/Prometheus

    compileOnly("com.simibubi.create:create-1.20.1:${forge_create_version}:slim") { transitive = false }
    compileOnly "net.createmod.ponder:Ponder-Forge-1.20.1:${forge_ponder_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-forge-api-1.20.1:${forge_flywheel_version}"
    //runtimeOnly "dev.engine-room.flywheel:flywheel-forge-1.20.1:${forge_flywheel_version}"
    compileOnly "com.tterrag.registrate:Registrate:${forge_registrate_version}"
    //runtimeOnly "io.github.llamalad7:mixinextras-forge:0.4.1"


    compileOnly "net.luckperms:api:5.4"//source: https://github.com/LuckPerms/LuckPerms

    compileOnly "curse.maven:ftbteams-404468:8074003"//home: https://www.curseforge.com/minecraft/mc-mods/ftb-teams-forge
    compileOnly "earth.terrarium.prometheus:prometheus-neoforge-1.20.4:1.4.2"//source: https://github.com/terrarium-earth/Prometheus
    compileOnly "earth.terrarium.argonauts:argonauts-neoforge-1.20.4:1.2.4"//source: https://modrinth.com/mod/odyssey-allies

    // Hack fix for now, force jopt-simple to be exactly 5.0.4 because Mojang ships that version, but some transtive dependencies request 6.0+
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

//    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
}

tasks.withType(JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
    source(project(":CreateSupportCommon").sourceSets.main.allSource)
    exclude("**/mixin/MixinOptionalEntityGetter.java")
}

processResources {
    from project(":Common").sourceSets.main.resources
    from project(":CreateSupportCommon").sourceSets.main.resources
}

tasks.named("sourcesJar", Jar) {
    from(project(":Common").sourceSets.main.allSource)
    from(project(":CreateSupportCommon").sourceSets.main.allSource)
}

//disabling this because it seems bugged, because of mod dependencies in the Common project, with no apparent workaround
//works fine in the Fabric one for some reason
tasks.getByName('compileTestJava').setEnabled(false)

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
            //fg.component(it)
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
