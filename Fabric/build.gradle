plugins {
    id 'idea'
    id 'fabric-loom'
}

base {
    archivesName = "${mod_name}-fabric-${minecraft_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly project(":Common")
    compileOnly project(":CreateSupportCommon")

    implementation 'com.electronwill.night-config:core:3.6.3'
    implementation 'com.electronwill.night-config:toml:3.6.3'
    modImplementation "net.minecraftforge:forgeconfigapiport-fabric:4.2.11"//source: https://github.com/Fuzss/forgeconfigapiport-fabric

    modCompileOnly "curse.maven:ftbranks-472659:3831005"//home: https://www.curseforge.com/minecraft/mc-mods/ftb-ranks-fabric
    modCompileOnly "curse.maven:architectury-419699:3843623"//home: https://www.curseforge.com/minecraft/mc-mods/architectury-api
    modCompileOnly "curse.maven:ftblibrary-438495:3831893"//home: https://www.curseforge.com/minecraft/mc-mods/ftb-library-fabric

    modCompileOnly "net.luckperms:api:5.4"//source: https://github.com/LuckPerms/LuckPerms
    modCompileOnly 'me.lucko:fabric-permissions-api:0.2-SNAPSHOT'//source: https://github.com/lucko/fabric-permissions-api

    modCompileOnly "curse.maven:ftbteams-438497:4611937"//home: https://www.curseforge.com/minecraft/mc-mods/ftb-teams-fabric

    modCompileOnly("com.simibubi.create:create-fabric-${minecraft_version}:${fabric_create_version}"){
        exclude(group: "com.jozufozu.flywheel")
        exclude(group: "net.minecraftforge")
    }
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}


processResources {
    from project(":Common").sourceSets.main.resources
    from project(":CreateSupportCommon").sourceSets.main.resources
    inputs.property "version", project.version
}


tasks.withType(JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
    source(project(":CreateSupportCommon").sourceSets.main.allSource)
}

packageSources {
    from(project(":CreateSupportCommon").sourceSets.main.allSource)//normal common project gets included by default but not this
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_name}" }
    }
}

jar.finalizedBy('packageSources')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
            artifact packageSources
        }
    }
}
