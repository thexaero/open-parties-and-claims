plugins {
    id 'idea'
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

base {
    archivesName = "${mod_name}-fabric-${minecraft_version}"
}

repositories{
    maven {
        url = "https://mvn.devos.one/snapshots"
    }// Create and several dependencies
    maven {
        url = "https://mvn.devos.one/releases"
    } // Porting Lib releases
    maven {
        url = "https://maven.jamieswhiteshirt.com/libs-release"
    } // Reach Entity Attributes
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly project(":Common")
    //TODO restore when create updates
//    compileOnly project(":CreateSupportCommon")

    implementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.1.3")//source: https://github.com/Fuzss/forgeconfigapiport-fabric

    compileOnly "curse.maven:ftbranks-472659:7921451"//home: https://www.curseforge.com/minecraft/mc-mods/ftb-ranks-fabric
    compileOnly "curse.maven:architectury-419699:4581904"//home: https://www.curseforge.com/minecraft/mc-mods/architectury-api
    compileOnly "curse.maven:ftblibrary-438495:7921510"//home: https://www.curseforge.com/minecraft/mc-mods/ftb-library-fabric

    //TODO switch back to fabric version when it's possible
    compileOnly "maven.modrinth:resourceful-lib:ihzjCwEV"//source: https://github.com/Team-Resourceful/ResourcefulLib
    //TODO switch back to fabric version when it's possible
    compileOnly "maven.modrinth:odyssey-roles:1.3.1"//source: https://github.com/terrarium-earth/Prometheus
    compileOnly "net.luckperms:api:5.4"//source: https://github.com/LuckPerms/LuckPerms
    compileOnly 'me.lucko:fabric-permissions-api:0.7.0'//source: https://github.com/lucko/fabric-permissions-api

    //TODO switch back to fabric version when it's possible
    compileOnly "curse.maven:ftbteams-404468:4616152"//home: https://www.curseforge.com/minecraft/mc-mods/ftb-teams-fabric
    compileOnly "maven.modrinth:odyssey-allies:0.1.1"//source: https://modrinth.com/mod/argonauts

    //TODO restore when possible
//    compileOnly("com.simibubi.create:create-fabric-1.20.1:${fabric_create_version}"){
//        exclude(group: "com.jozufozu.flywheel")
//        exclude(group: "net.minecraftforge")
//        exclude(group: "net.fabricmc.fabric-api")
//    }
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
            //vmArg("-Dmixin.debug.export=true")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}


processResources {
    from project(":Common").sourceSets.main.resources
    //TODO restore when create updates
//    from project(":CreateSupportCommon").sourceSets.main.resources
    inputs.property "version", project.version
    exclude "META-INF/*_core.js"
    exclude "META-INF/coremods.json"
}


tasks.withType(JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
    //TODO restore when create updates
//    source(project(":CreateSupportCommon").sourceSets.main.allSource)
}

packageSources {
    //TODO restore when create updates
//    from(project(":CreateSupportCommon").sourceSets.main.allSource)//normal common project gets included by default but not this
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_name}" }
    }
}

jar.finalizedBy('packageSources')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
            artifact packageSources
        }
    }
}
